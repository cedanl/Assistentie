[tool.uv]
cache-dir = "./.uv_cache"

[project]
name = "streamlit-app-template"
version = "0.1.0"
description = "CEDA Python Streamlit App Template"
authors = [
    {name = "Ash Sewnandan", email = "asewnandan@hhs.nl"},
    {name = "Iwan Tomer", email = "t.iwan@vu.nl"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ruff>=0.15.10",
    "streamlit>=1.46.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
